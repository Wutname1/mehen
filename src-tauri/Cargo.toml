[package]
name = "mehen"
version = "0.1.0"
description = "Mehen - checks every project's dependencies and updates them for you"
authors = ["Jeremy"]
edition = "2024"

[lib]
name = "mehen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mehen-core = { path = "../crates/mehen-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.4.0"
tokio = { version = "1.53.1", features = ["rt", "time"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
tauri-winrt-notification = "0.7"
