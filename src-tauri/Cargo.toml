[package]
name = "mehen"
version = "0.1.0"
description = "Mehen - keeps every project's dependencies current and safe"
authors = ["Jeremy"]
edition = "2024"

[lib]
name = "mehen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mehen-core = { path = "../crates/mehen-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
