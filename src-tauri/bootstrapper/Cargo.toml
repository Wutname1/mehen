[package]
name = "mehen-setup"
version = "1.0.0"
edition = "2021"
description = "Mehen installer bootstrapper"
authors = ["Mehen"]

# Its own workspace root. It sits inside the app's crate directory, and the
# repo workspace claims everything under a member path (an `exclude` there
# cannot override that), so without this Cargo would refuse to build it.
[workspace]

[[bin]]
name = "mehen-setup"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
png = "0.17"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    # Snapshotting the process list, to spot the relaunched app after an update.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
