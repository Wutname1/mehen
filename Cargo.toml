[workspace]
members = ["crates/mehen-core", "src-tauri"]
resolver = "2"

# Dev builds keep our own code quick to rebuild but optimize dependencies
# (JSON, regex, SQLite, the folder walker): checks in `tauri dev` run several
# times faster for one slower first build.
[profile.dev.package."*"]
opt-level = 2

# The engine is optimized like a dependency. Level 1 would expect its
# dependencies to share generic code, which they stop doing at level 2, and
# the app then fails to link.
[profile.dev.package.mehen-core]
opt-level = 2
