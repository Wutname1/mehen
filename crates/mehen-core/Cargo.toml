[package]
name = "mehen-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
globset = "0.4.20"
ignore = "0.4.33"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "sync", "time"] }
toml = "1.1.6"
yaml-rust2 = "0.13.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "sync", "time"] }
