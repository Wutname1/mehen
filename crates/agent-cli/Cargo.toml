[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"
description = "Drives the user's own signed-in Claude Code and Codex command-line tools to do a task in a folder"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
